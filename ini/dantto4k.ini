[bondriver]
bondriverPath=BonDriver_BDA.dll

; mmtsDumpPath specifies the path to dump the MMTS for debugging (optional)
mmtsDumpPath=

; decodeDump=true writes the ACAS-decrypted MMT/TLV to mmtsDumpPath
decodeDump=false

[acas]
; Opt in to EMM entitlement updates addressed to the connected ACAS module.
; Disabled by default. Restart dantto4k after changing this setting.
enableEmm=false

; optional
casProxyServer=

; optional
smartCardReaderName=

; optional
customWinscardDLL=

[audio]
disableADTSConversion=false

[epg]
; convertResolutionGaiji=false keeps the ARIB STD-B62 pictograms (4K/8K/22.2ch/HDR/...)
; from being converted to bracketed text like "[4K]" in event names and descriptions.
; Set to false if your player already shows this information itself (e.g. TVTest's
; own resolution/audio-channel icons) and you don't need it duplicated in the title.
convertResolutionGaiji=true

[appdata]
; enable=false stops carrying data broadcasting (ARIB STD-B62) into the TS.
; It is sent as private sections on PID (PMT PID - 0x100), see docs/app-data-ts-transport.md.
enable=true

; Seconds before an unchanged data broadcasting file is sent again (minimum 1)
itemResendInterval=10

[subtitle]
; optional: write subtitle DRCS debug log
debugLogPath=
