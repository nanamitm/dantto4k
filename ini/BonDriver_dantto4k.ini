[bondriver]
bondriverPath=BonDriver_BDA.dll

; mmtsDumpPath specifies the path to dump the MMTS for debugging (optional)
mmtsDumpPath=

[acas]
; optional
casProxyServer=

; optional
smartCardReaderName=

; optional
customWinscardDLL=

[audio]
disableADTSConversion=false

[subtitle]
; optional: write subtitle DRCS debug log
debugLogPath=

; Corner and black brackets are transmitted as MSZ (half-width) in ARIB
; broadcasts. Set to true to keep them as MSZ, matching ARIB font metrics.
; Set to false (default) to force NSZ (full-width) for general fonts.
aribBracketSquish=false
